<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d3d"><title>賽程表</title><link rel="stylesheet" href="style.css?v=pending-20261019-1"><script defer src="bracket.js?v=pending-20261019-1"></script><script defer src="config.js?v=pending-20261019-1"></script><script defer src="cloud.js?v=pending-20261019-1"></script><script defer src="app.js?v=pending-20261019-1"></script></head>
<body><header><a class="brand" href="./">賽程表</a><div class="account"><span id="mode"></span><button id="login">管理者登入</button><button id="logout" hidden>登出</button></div></header>
<main><section class="setup" id="setup" aria-label="賽事設定"><label class="title-field">賽事名稱<input id="title" maxlength="80" value="我的盃賽"></label><label>參賽人數<div class="number-wrap"><input id="count" type="number" min="2" max="128" step="1" value="15"><span>人</span></div></label><button id="draw" class="primary">抽籤／建立賽程</button></section>
<section class="workspace"><div class="workspace-head"><div><h2 id="event-title"></h2><div id="stats" class="stats"></div></div><div class="toolbar"><button id="migrate" data-edit hidden>匯入本機進度</button><button id="view">回到中央</button><button id="undo" data-edit>復原</button><button id="clear" data-edit>清除賽果</button><button id="export">匯出備份</button><button id="import" data-edit>匯入</button><button id="print">列印 / PDF</button><input hidden id="file" type="file" accept=".json,application/json"></div></div>
<section id="pending-panel" class="pending-panel" aria-label="待打對局" hidden><div class="pending-head"><strong id="pending-title">待打對局</strong><button id="next-match">找下一場</button></div><div id="pending-list" class="pending-list"></div></section>
<div class="hint"><span>拖曳空白處移動 · 點選選手晉級</span><span id="saved" role="status"></span></div>
<div id="empty" hidden></div><div class="bracket-scroll" tabindex="0" aria-label="賽程圖，可拖曳空白處或用方向鍵捲動"><div id="bracket"><svg id="lines" aria-hidden="true"></svg><div id="rounds"></div><div id="bronze" aria-label="三四名決定賽"></div></div></div>
<div class="results-area"><section class="podium"><div id="podium"></div></section></div></section></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm"><h3 id="confirm-title"></h3><p id="confirm-text"></p><div><button id="cancel">取消</button><button id="accept" class="primary">確定</button></div></dialog>
<dialog id="login-dialog"><form id="login-form"><h3>管理者登入</h3><label>電子信箱<input id="email" type="email" autocomplete="email" required></label><p id="login-message">寄送一次性登入連結至你的信箱。</p><div><button type="button" id="login-cancel">取消</button><button type="submit" id="send-login" class="primary">寄送登入連結</button></div></form></dialog></body></html>
